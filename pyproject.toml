[project]
name = "ai-cover-studio"
version = "1.0.0"
description = "AI Cover Studio - Voice Cloning and Conversion"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.25.0",
    "gradio>=4.0.0",
]

[build-system]
requires = [
    "setuptools",
    "wheel",
    "cython~=0.29.30",
    "numpy>=1.22.0",
    "packaging",
]

[flake8]
max-line-length=120

[tool.black]
line-length = 120
target-version = ['py39']

[tool.isort]
line_length = 120
profile = "black"
multi_line_output = 3
