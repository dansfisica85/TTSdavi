[project]
name = "ai-cover-studio"
version = "1.0.0"
description = "AI Cover Studio - Voice Cloning and Conversion"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.25.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = []

[flake8]
max-line-length=120

[tool.black]
line-length = 120
target-version = ['py39']

[tool.isort]
line_length = 120
profile = "black"
multi_line_output = 3
