# Configuração Nixpacks para Railway (alternativa ao Dockerfile)
[phases.setup]
nixPkgs = ["python310", "ffmpeg", "espeak-ng", "gcc", "libsndfile"]

[phases.install]
cmds = [
    "pip install --upgrade pip",
    "pip install -r requirements-railway.txt"
]

[start]
cmd = "python ai_cover_app.py"

[variables]
GRADIO_SERVER_NAME = "0.0.0.0"
GRADIO_SERVER_PORT = "7860"
