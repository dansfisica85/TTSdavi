# Configuração Nixpacks para Railway (lightweight)
[phases.setup]
nixPkgs = ["python310", "ffmpeg", "libsndfile"]

[phases.install]
cmds = [
    "pip install --no-cache-dir -r requirements-railway.txt"
]

[start]
cmd = "python ai_cover_app.py"

[variables]
GRADIO_SERVER_NAME = "0.0.0.0"
PORT = "8080"
PIP_NO_CACHE_DIR = "1"
